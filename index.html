<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Блоки</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:-apple-system,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#L,#R{position:fixed;top:0;bottom:0;touch-action:none}
#L{left:0;width:45%}#R{right:0;width:55%}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#joy{position:fixed;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7)}
.b{position:fixed;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.7);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;touch-action:none;z-index:5}
.b.on{background:rgba(60,160,60,.7)}
#jp{right:24px;bottom:calc(40px + env(safe-area-inset-bottom))}
#pl{right:98px;bottom:calc(40px + env(safe-area-inset-bottom))}
#bk{right:24px;bottom:calc(114px + env(safe-area-inset-bottom))}
#iv{right:98px;bottom:calc(114px + env(safe-area-inset-bottom))}
#sp{right:24px;bottom:calc(188px + env(safe-area-inset-bottom))}
#top{position:fixed;left:0;right:0;top:calc(6px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:5}
#bar{display:flex;gap:3px;pointer-events:auto}
#bar .slot{width:36px;height:36px;aspect-ratio:auto}
#bar .slot.on{border-color:#fff;box-shadow:0 0 0 2px #000;transform:scale(1.1)}
#hud{font-size:18px;text-shadow:1px 1px 2px #000;color:#fff;letter-spacing:1px}
#dbg{position:fixed;left:6px;top:calc(78px + env(safe-area-inset-top));font:11px/1.35 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.45);padding:4px 6px;border-radius:6px;z-index:5;white-space:pre;pointer-events:auto}
#toast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 12px;border-radius:8px;font-size:15px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:6;text-align:center;max-width:80vw}
#mb{position:fixed;left:50%;top:calc(50% + 24px);width:80px;height:6px;margin-left:-40px;background:rgba(0,0,0,.5);display:none;pointer-events:none}
#mb i{display:block;height:100%;width:0;background:#fff}
#dmg{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:4}
#pick{position:fixed;left:50%;top:calc(50% + 44px);transform:translateX(-50%);color:#fff;font-size:14px;line-height:1.3;text-shadow:1px 1px 2px #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6;text-align:center;white-space:pre}
.slot{aspect-ratio:1;background:rgba(0,0,0,.4) center/100% 100% no-repeat;border:2px solid rgba(255,255,255,.3);border-radius:4px;position:relative;box-sizing:border-box;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.slot span{position:absolute;right:2px;bottom:0;font-size:12px;font-weight:700;text-shadow:1px 1px 2px #000}
.slot.ph{opacity:.9}
.slot.ph i{opacity:.35;font-style:normal}
#inv{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none;align-items:center;justify-content:center}
#inv.on{display:flex}
#panel{width:min(94vw,440px);max-height:92vh;overflow:auto;background:#3b3b46;border:3px solid #888;border-radius:10px;padding:10px;color:#fff;box-sizing:border-box;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
button{font:inherit;color:#fff;background:#5a5a68;border:2px solid #999;border-radius:6px;padding:6px 10px}
button.act{background:#4a7a4a}
#armrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
#armrow .slot{width:44px;flex:none}
#tabs{display:flex;gap:6px;margin-bottom:8px}
.sep{height:8px}
.rec{display:flex;gap:8px;align-items:center;padding:6px;border-radius:6px;background:rgba(255,255,255,.08);margin-bottom:5px;opacity:.55;font-size:14px}
.rec.ok{opacity:1;background:rgba(80,180,80,.25)}
.rec .slot{width:40px;flex:none}
.g{color:#8f8}.r{color:#f99}
#hand{margin-top:8px;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
#hand .slot{width:40px}
#chest{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:21;display:none;align-items:center;justify-content:center}
#chest.on{display:flex}
</style>

<body>
<canvas id="c"></canvas>
<div id="L"></div><div id="R"></div>
<div id="cross"></div>
<div id="joy"><div id="knob"></div></div>
<div id="mb"><i></i></div>
<div id="dmg"></div>
<div id="toast"></div>
<div id="pick"></div>
<div id="top"><div id="bar"></div><div id="hud"></div></div>
<div id="dbg">FPS --</div>
<div class="b" id="bk">⛏</div>
<div class="b" id="pl">🧱</div>
<div class="b" id="jp">⬆</div>
<div class="b" id="iv">🎒</div>
<div class="b" id="sp">💨</div>
<div id="inv"><div id="panel">
<div class="hdr"><b>Рюкзак</b><button id="x">✕ Закрыть</button></div>

<div id="tabs"><button id="t0" class="act">Предметы</button><button id="t1">Крафт</button></div>
<div id="tab0"><div class="grid" id="grid"></div><div class="sep"></div><div class="grid" id="hb"></div></div>
<div id="tab1" style="display:none"><div id="rec"></div></div>
<div id="hand"></div>
<div style="margin-top:10px"><button id="newg">Новый мир</button></div>
</div></div>
<div id="chest"><div id="panel">
<div class="hdr"><b>Сундук</b><button id="cx">✕ Закрыть</button></div>
<div class="grid" id="cgrid"></div>
</div></div>
<script>
(()=>{
'use strict';
/* ---------- параметры мира ---------- */
const CS=16,H=64,NCH=96,WS=NCH*CS;
const DAYLEN=300;
const BEDROCK_Y=1;
const CAVE_MIN=4, CAVE_MAX=44;
const WATER=41, CHEST=42, BEDROCK=40;
let SEED=0,edits={},chests={};
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function hash3(x,y,z){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h=Math.imul(h^(h>>>16),2654435761);return((h^(h>>>15))>>>0)/4294967295}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
const s=t=>t*t*(3-2*t);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);
const u=s(xf),v=s(yf);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function vnoise3(x,y,z){
const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
const xf=x-xi,yf=y-yi,zf=z-zi;
const s=t=>t*t*(3-2*t);
const u=s(xf),v=s(yf),w=s(zf);
function n(i,j,k){return hash3(xi+i,yi+j,zi+k)}
const a=n(0,0,0),b=n(1,0,0),c=n(0,1,0),d=n(1,1,0);
const e=n(0,0,1),f=n(1,0,1),g=n(0,1,1),h=n(1,1,1);
const x00=a+(b-a)*u, x10=c+(d-c)*u;
const x01=e+(f-e)*u, x11=g+(h-g)*u;
const y0=x00+(x10-x00)*v, y1=x01+(x11-x01)*v;
return y0+(y1-y0)*w;
}
/* ---------- РЕКИ ---------- */
function riverVal(x,z){
const s=SEED*7.3;
let n=0,amp=1,f=1;
for(let i=0;i<4;i++){n+=amp*(1-Math.abs(vnoise(x/(90/f)+s*i, z/(90/f)+s*(i+1))-.5)*2);amp*=.5;f*=2}
const base=Math.abs(vnoise(x/240+s,z/240-s*.7)-.5)*2;
return 1-Math.abs(n*.6+base*.4);
}
function riverAt(x,z){
const r=riverVal(x,z);
if(r<.90)return 0;
return Math.min(1,(r-.90)/.08);
}
/* ---------- высоты ---------- */
function heightAt(x,z){
const a=vnoise(x/110+SEED,z/110+SEED*.7),b=vnoise(x/40+SEED*1.3,z/40+SEED),c=vnoise(x/14+SEED,z/14+SEED*2.1),d=vnoise(x/5+SEED,z/5);
const n=a*.5+b*.3+c*.15+d*.05;
let h=22+(n-.5)*30;
const mk=vnoise(x/220+SEED*3,z/220+SEED*.4);
if(mk>.58)h+=(mk-.58)*85;
h=Math.max(BEDROCK_Y+3,Math.min(H-6,Math.floor(h)));
const rv=riverAt(x,z);
if(rv>0){
const target=13+Math.floor(vnoise(x/30+SEED,z/30)*3);
const cut=h-(h-target)*Math.min(1,rv*1.6);
h=Math.max(BEDROCK_Y+2,Math.floor(cut));
}
return h}

/* ---------- данные ---------- */
const BL={
1:{n:'Трава',t:[0,2,1],h:.6},
2:{n:'Земля',t:[2,2,2],h:.5},
3:{n:'Камень',t:[3,3,3],h:3},
4:{n:'Дерево',t:[5,5,4],h:2},
5:{n:'Листва',t:[6,6,6],h:.25},
6:{n:'Песок',t:[7,7,7],h:.5},
7:{n:'Доски',t:[8,8,8],h:2},
8:{n:'Кирпич',t:[9,9,9],h:3},
9:{n:'Угольная руда',t:[10,10,10],h:3.5},
10:{n:'Железная руда',t:[11,11,11],h:4},
11:{n:'Снег',t:[17,17,17],h:.3},
40:{n:'Бедрок',t:[12,12,12],h:Infinity},
41:{n:'Вода',t:[18,18,18],h:.8},
42:{n:'Сундук',t:[19,19,19],h:1.2}};
const IT={20:'Палка',21:'Уголь',22:'Железный слиток',50:'Яблоко',51:'Хлеб',52:'Жареное мясо',53:'Сырое мясо',54:'Кость'};
const FOOD={50:{hp:4,n:'Яблоко'},51:{hp:6,n:'Хлеб'},52:{hp:8,n:'Жареное мясо'}};
const TOOL={
23:{k:'p',tier:1,mult:2,dmg:2,n:'Деревянная кирка',c:'#a07840'},
24:{k:'p',tier:2,mult:4,dmg:3,n:'Каменная кирка',c:'#8a8a8e'},
25:{k:'p',tier:3,mult:7,dmg:4,n:'Железная кирка',c:'#d0d0da'},
26:{k:'s',tier:0,mult:1.5,dmg:4,n:'Деревянный меч',c:'#a07840'},
27:{k:'s',tier:0,mult:1.5,dmg:5,n:'Каменный меч',c:'#8a8a8e'},
28:{k:'s',tier:0,mult:1.5,dmg:7,n:'Железный меч',c:'#d0d0da'}};
const ARM={
29:{s:0,v:2,n:'Железный шлем'},
30:{s:1,v:4,n:'Железный нагрудник'},
31:{s:2,v:3,n:'Железные поножи'},
32:{s:3,v:2,n:'Железные ботинки'}};
const name=id=>(BL[id]&&BL[id].n)||IT[id]||(TOOL[id]&&TOOL[id].n)||(ARM[id]&&ARM[id].n)||(FOOD[id]&&FOOD[id].n)||'?';
const stackable=id=>!TOOL[id]&&!ARM[id];
const RECS=[
{o:7,n:4,i:[[4,1]]},
{o:20,n:4,i:[[7,2]]},
{o:23,n:1,i:[[7,3],[20,2]]},
{o:26,n:1,i:[[7,2],[20,1]]},
{o:24,n:1,i:[[3,3],[20,2]]},
{o:27,n:1,i:[[3,2],[20,1]]},
{o:8,n:1,i:[[3,4]]},
{o:22,n:1,i:[[10,1],[21,1]]},
{o:25,n:1,i:[[22,3],[20,2]]},
{o:28,n:1,i:[[22,2],[20,1]]},
{o:29,n:1,i:[[22,5]]},
{o:30,n:1,i:[[22,8]]},
{o:31,n:1,i:[[22,7]]},
{o:32,n:1,i:[[22,4]]},
{o:51,n:1,i:[[50,3]]}];

/* ---------- структуры ---------- */
const VCH=128;
function cellHash(cx,cz,salt){return hash(cx*73856093+SEED+salt,cz*19349663-SEED-salt)}
function structureAtCell(gx,gz){
const h=cellHash(gx,gz,1);
// вышки — самые частые
const isTower=h<.25;
const isVillage=!isTower&&h<.42;
const isRuin=!isTower&&!isVillage&&h<.55;
const isMine=!isTower&&!isVillage&&!isRuin&&h<.65;
if(!isTower&&!isVillage&&!isRuin&&!isMine)return null;
const ox=8+Math.floor(cellHash(gx,gz,2)*(VCH-16));
const oz=8+Math.floor(cellHash(gx,gz,3)*(VCH-16));
const wx=gx*VCH+ox, wz=gz*VCH+oz;
if(wx<8||wz<8||wx>=WS-8||wz>=WS-8)return null;
if(riverAt(wx,wz)>0)return null;
const gy=heightAt(wx,wz);
if(gy<=13)return null;
return {gx,gz,wx,wz,gy,type:isTower?'tower':isVillage?'village':isRuin?'ruin':'mine'};
}
const STRUCT_CACHE=new Map();
function structuresNearChunk(cx,cz){
const key=cx+','+cz;
if(STRUCT_CACHE.has(key))return STRUCT_CACHE.get(key);
const px=Math.floor((cx*CS)/VCH),pz=Math.floor((cz*CS)/VCH);
const list=[];
for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
const s=structureAtCell(px+dx,pz+dz);
if(s)list.push(s);
}
STRUCT_CACHE.set(key,list);
return list;
}

/* ---------- чанки ---------- */
const recs=new Array(NCH*NCH);
const active=new Set();
function recAt(cx,cz){const i=cx*NCH+cz;return recs[i]||(recs[i]={cx,cz,i,data:null,top:H-1,parts:[],np:0,quads:0,has:false,dirty:true,seen:0,d2:0,pri:0,vis:false})}
let lk=-1,ld=null;
function ensureData(r){if(!r.data){genChunk(r);active.add(r)}return r.data}
function getB(x,y,z){
if(y<0||y>=H||x<0||z<0||x>=WS||z>=WS)return 0;
const k=(x>>4)*NCH+(z>>4);
if(k!==lk){ld=ensureData(recAt(x>>4,z>>4));lk=k}
return ld[(y*CS+(z&15))*CS+(x&15)]}
function isCave(x,y,z){
if(y<=BEDROCK_Y)return false;
if(y<CAVE_MIN||y>CAVE_MAX)return false;
const s=SEED*13.7;
const n1=vnoise3(x/18+s, y/12+s*0.3, z/18+s)-0.5;
const n2=vnoise3(x/20+s*1.7, y/14+s*0.7, z/20+s)-0.5;
const worm=Math.sqrt(n1*n1+n2*n2);
if(worm<0.055)return true;
if(y<CAVE_MAX-6){
const hall=vnoise3(x/34+s*0.5,y/22+s,z/34+s*0.9);
if(hall>0.72)return true;
}
return false}

/* ---------- сундуки: лут ---------- */
function genChestLoot(x,y,z){
const r=hash(x*31+7+y*13,z*17+3);
const loot=[];
// вышки: еда и немного руды, деревни: инструменты/броня
const roll=hash(x,z);
const isTower=Math.floor((x)/VCH)*1000+Math.floor((z)/VCH);
const towerKey=hash(isTower, 777);
if(towerKey<.5){
// еда
const foods=[[50,1+Math.floor(r*3)],[51,1+Math.floor(r*2)],[52,1+Math.floor(r*1)]];
for(let i=0;i<2+Math.floor(roll*3);i++){
const p=foods[Math.floor(hash(x+i*13,z+i*7)*foods.length)];
loot.push({id:p[0],count:1+Math.floor(hash(x+i,z+i)*p[1])});
}
// немного железа
if(roll>.5)loot.push({id:22,count:1});
} else {
// деревня
loot.push({id:20,count:2+Math.floor(r*4)});
loot.push({id:21,count:1+Math.floor(r*5)});
if(roll>.3)loot.push({id:22,count:1+Math.floor(r*2)});
if(roll>.6)loot.push({id:23,count:1});
if(roll>.8)loot.push({id:50,count:2});
}
return loot.slice(0,9);
}

function applyStructures(data,cx,cz){
const list=structuresNearChunk(cx,cz);
if(!list.length)return;
const bx=cx*CS,bz=cz*CS;
function put(x,y,z,id){
const lx=x-bx,lz=z-bz;
if(lx<0||lx>=CS||lz<0||lz>=CS||y<0||y>=H)return;
data[(y*CS+lz)*CS+lx]=id;
}
function setChest(x,y,z){
put(x,y,z,CHEST);
const key=x+','+y+','+z;
if(!chests[key]){
chests[key]={items:genChestLoot(x,y,z)};
}
}
for(const st of list){
if(st.type==='tower'){
// башня 5x5, высота 8
const hy=st.gy;
const w=2;
// фундамент и стены
for(let x=-w;x<=w;x++)for(let z=-w;z<=w;z++){
put(st.wx+x,hy,st.wz+z,3);
// стены
if(Math.abs(x)===w||Math.abs(z)===w){
for(let y=1;y<=8;y++)put(st.wx+x,hy+y,st.wz+z,3);
}
}
// крыша
for(let x=-w;x<=w;x++)for(let z=-w;z<=w;z++)put(st.wx+x,hy+9,st.wz+z,8);
// дверной проём
for(let y=1;y<=2;y++)put(st.wx,hy+y,st.wz+w,0);
// пол на 2-м этаже
for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++)put(st.wx+x,hy+4,st.wz+z,7);
// лестница из земли
put(st.wx+1,hy+1,st.wz+w+1,7);
put(st.wx+1,hy+2,st.wz+w,7);
// сундук на 2 этаже
setChest(st.wx,hy+5,st.wz);
// немного факелов? нет — не нужны
} else if(st.type==='village'){
// дорога
for(let dx=-6;dx<=6;dx++)for(let dz=-6;dz<=6;dz++){
if(Math.abs(dx)<2||Math.abs(dz)<2){
const y=heightAt(st.wx+dx,st.wz+dz);
put(st.wx+dx,y,st.wz+dz,6);
for(let k=1;k<=2;k++)put(st.wx+dx,y+k,st.wz+dz,0);
}
}
const houses=3+Math.floor(cellHash(st.gx,st.gz,4)*3);
for(let hI=0;hI<houses;hI++){
const ang=hI/houses*Math.PI*2;
const hx=st.wx+Math.round(Math.cos(ang)*(6+Math.floor(cellHash(st.gx+hI,st.gz,5)*4)));
const hz=st.wz+Math.round(Math.sin(ang)*(6+Math.floor(cellHash(st.gx,st.gz+hI,6)*4)));
const hy=heightAt(hx,hz);
if(hy<=13)continue;
const w=4+Math.floor(cellHash(hx,hz,7)*2);
const d=4+Math.floor(cellHash(hz,hx,8)*2);
for(let x=-w;x<=w;x++)for(let z=-d;z<=d;z++){
put(hx+x,hy,hz+z,7);
if(Math.abs(x)===w||Math.abs(z)===d){
for(let y=1;y<=3;y++)put(hx+x,hy+y,hz+z,7);
}
}
for(let x=-w;x<=w;x++)for(let z=-d;z<=d;z++)put(hx+x,hy+4,hz+z,8);
for(let y=1;y<=2;y++)put(hx,hy+y,hz+d,0);
setChest(hx,hy+1,hz+d-1);
}
} else if(st.type==='ruin'){
const w=3+Math.floor(cellHash(st.gx,st.gz,9)*3);
const hy=st.gy;
for(let x=-w;x<=w;x++)for(let z=-w;z<=w;z++){
const r=hash(x*3+z*7+st.wx,z*5+x*11+st.wz);
if(r>.45)put(st.wx+x,hy,st.wz+z,8);
if(r>.6)for(let y=1;y<=Math.floor(r*3);y++)put(st.wx+x,hy+y,st.wz+z,8);
}
// иногда сундук
if(hash(st.wx,st.wz)>.5)setChest(st.wx,hy+1,st.wz);
} else if(st.type==='mine'){
// шахтный вход: каменная рамка + лестница вниз
const hy=st.gy;
for(let x=-2;x<=2;x++)for(let z=-2;z<=2;z++){
if(Math.abs(x)===2||Math.abs(z)===2){
for(let y=0;y<=3;y++)put(st.wx+x,hy+y,st.wz+z,3);
}
}
for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++){
for(let y=1;y<=3;y++)put(st.wx+x,hy+y,st.wz+z,0);
}
// лестница вниз
for(let y=0;y<8;y++){
put(st.wx,hy-1-y,st.wz,7);
// подсветка не нужна
}
setChest(st.wx,hy+1,st.wz);
}
}
}

function genChunk(r){
const cx=r.cx,cz=r.cz,data=new Uint8Array(CS*H*CS);let top=0;
for(let lz=0;lz<CS;lz++)for(let lx=0;lx<CS;lx++){
const x=cx*CS+lx,z=cz*CS+lz;
const rv=riverAt(x,z);
const h=heightAt(x,z);
const sb=h<=17?6:(h>=46?11:(h>=40?3:1));
for(let y=0;y<=h;y++){
let b;
if(y<=BEDROCK_Y)b=BEDROCK;
else if(y===h)b=sb;
else if(y>h-4)b=(sb===6?6:(sb===1?2:3));
else{b=3;if(y>0){const q=hash(x*31+y*17+SEED,z*13+y*7+99);if(q<.06)b=9;else if(q>.96&&y<=30)b=10}}
data[(y*CS+lz)*CS+lx]=b}
// пещеры
for(let y=BEDROCK_Y+1;y<=h;y++){
if(y===h)continue;
if(isCave(x,y,z))data[(y*CS+lz)*CS+lx]=0}
// вода реки: заполняем до уровня target
if(rv>0){
const wl=13+Math.floor(vnoise(x/30+SEED,z/30)*3);
for(let y=Math.max(BEDROCK_Y+1,h+1);y<=wl;y++){
const ix=(y*CS+lz)*CS+lx;
if(data[ix]===0)data[ix]=WATER;
}
// если земля ниже воды — вода сверху
for(let y=h+1;y<=wl;y++)data[(y*CS+lz)*CS+lx]=WATER;
}
if(h>top)top=h}
// деревья
for(let tz=cz*CS-2;tz<cz*CS+CS+2;tz++)for(let tx=cx*CS-2;tx<cx*CS+CS+2;tx++){
if(tx<0||tz<0||tx>=WS||tz>=WS)continue;
if(riverAt(tx,tz)>0)continue;
if(hash(tx*3+7+SEED,tz*5+11)<.99)continue;
const h=heightAt(tx,tz);if(h<18||h>=40)continue;
const th=4+Math.floor(hash(tx,tz+3)*2);
const lx0=tx-cx*CS,lz0=tz-cz*CS;
if(lx0>=0&&lx0<CS&&lz0>=0&&lz0<CS)for(let k=1;k<=th;k++)data[((h+k)*CS+lz0)*CS+lx0]=4;
for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=th-1;dy<=th+1;dy++){
if(Math.abs(dx)+Math.abs(dz)+Math.abs(dy-th)>3)continue;
const lx=lx0+dx,lz=lz0+dz,y=h+dy;
if(lx<0||lx>=CS||lz<0||lz>=CS||y>=H)continue;
const ix=(y*CS+lz)*CS+lx;
if(!data[ix])data[ix]=5}
if(h+th+1>top)top=h+th+1}
// структуры
applyStructures(data,cx,cz);
const ed=edits[r.i];
if(ed)for(const k in ed){data[k]=ed[k];const y=(k|0)>>8;if(y>top)top=y}
r.data=data;r.top=Math.min(H-1,top)}
function solid(x,y,z){
if(x<0||z<0||x>=WS||z>=WS||y<0)return true;
if(y>=H)return false;
const b=getB(x,y,z);
return b!==0&&b!==WATER;
}
function isWaterAt(x,y,z){return getB(x,y,z)===WATER}
function groundY(x,z){for(let y=H-1;y>0;y--){const b=getB(x,y,z);if(b&&b!==4&&b!==5&&b!==BEDROCK&&b!==WATER&&b!==CHEST)return y}return BEDROCK_Y+1}

function addItem(id,n){
if(stackable(id))for(let i=0;i<36&&n>0;i++){const s=inv[i];if(s&&s.id===id&&s.count<64){const t=Math.min(64-s.count,n);s.count+=t;n-=t}}
for(let i=0;i<36&&n>0;i++){if(!inv[i]){const t=stackable(id)?Math.min(64,n):1;inv[i]={id,count:t};n-=t}}
return n}
function countOf(id){let c=0;for(const s of inv)if(s&&s.id===id)c+=s.count;return c}
function takeItem(id,n){for(let i=0;i<36&&n>0;i++){const s=inv[i];if(s&&s.id===id){const t=Math.min(s.count,n);s.count-=t;n-=t;if(!s.count)inv[i]=null}}}
const canCraft=r=>r.i.every(([id,c])=>countOf(id)>=c);
function craft(r){if(!canCraft(r))return;r.i.forEach(([id,c])=>takeItem(id,c));
const left=addItem(r.o,r.n);if(left>0){dropAtPlayer(r.o,left);toast('Нет места — предмет выброшен')}renderInv();renderHUD()}
const armorPts=()=>arm.reduce((a,s)=>a+(s?ARM[s.id].v:0),0);

P.sat=Math.min(P.food, P.sat+n*.6);
P.exh=0;
}
function eatFood(id){
const f=FOOD[id];if(!f)return;
if(P.food>=20){toast('Ты не голоден');return}
addFood(f.hp);
renderHUD()}
function updateFood(dt){
// траты
P.exh+=dt*(P.ground?0.1:0.05);
if(sprint)P.exh+=dt*0.4;
if(P.inWater)P.exh+=dt*0.2;
// голод
if(P.exh>=4){P.exh-=4;
if(P.sat>0)P.sat=Math.max(0,P.sat-1);
else P.food=Math.max(0,P.food-1);
renderHUD()}
// реген при полном голоде
if(P.food>=18&&P.hp<20){
P.regen=(P.regen||0)+dt;
if(P.regen>4){P.regen=0;P.hp++;P.sat=Math.max(0,P.sat-1);renderHUD()}
}
// урон при 0 голода
if(P.food<=0){
P.starve=(P.starve||0)+dt;
if(P.starve>4){P.starve=0;P.hp-=1;flash=.3;if(P.hp<=0)die();renderHUD()}
}
// реген вне боя, если голод > 18
}

const pl=planes(m);
const pl2=planes(mul(persp(FOV*1.3,aspect,.1,200),lk_.m));
const pcx=Math.min(NCH-1,Math.max(0,Math.floor(P.x/CS))),pcz=Math.min(NCH-1,Math.max(0,Math.floor(P.z/CS)));
if(now-lastClean>.5){lastClean=now;clean(now,pcx,pcz)}
needArr.length=0;drawArr.length=0;
let meshCount=0;
for(let dz=-RD;dz<=RD;dz++)for(let dx=-RD;dx<=RD;dx++){
const cx=pcx+dx,cz=pcz+dz;
if(cx<0||cz<0||cx>=NCH||cz>=NCH)continue;
const d2=dx*dx+dz*dz;if(d2>RD*RD+RD)continue;
const r=recAt(cx,cz);r.d2=d2;
const topY=r.data?r.top+2:H;
const x0=cx*CS,z0=cz*CS;
const vis=inFrustum(pl,x0,0,z0,x0+CS,topY,z0+CS);
const vis2=vis||inFrustum(pl2,x0,0,z0,x0+CS,topY,z0+CS);
r.vis=vis;if(vis2)r.seen=now;
if(r.has)meshCount++;
if((vis2||d2<=NEAR2)&&(!r.has||r.dirty)){r.pri=d2+(vis?0:200);needArr.push(r)}
if(vis&&r.has&&r.np)drawArr.push(r)}
needArr.sort((a,b)=>a.pri-b.pri);
stNeed=needArr.length;
const budget=frameNo<90?30:4,t0=performance.now();
for(let i=0;i<needArr.length;i++){
const r=needArr[i],had=r.has;
meshChunk(r);
if(!had&&r.vis&&r.np)drawArr.push(r);
if(performance.now()-t0>budget)break}
stMesh=meshCount;
const fogF=RD*CS-4,fogN=fogF*.45;
gl.clearColor(sky.hor[0],sky.hor[1],sky.hor[2],1);
gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
matF.set(m);
setWorldU(pw,WL,sky,now,fogN,fogF);
let quads=0;
for(const r of drawArr){
for(let k=0;k<r.np;k++){const p=r.parts[k];
if(vaoExt)vaoExt.bindVertexArrayOES(p.vao);
else{gl.bindBuffer(gl.ARRAY_BUFFER,p.vbo);attribs();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo)}
gl.drawElements(gl.TRIANGLES,p.n,gl.UNSIGNED_SHORT,0)}
quads+=r.quads}
stDrawn=drawArr.length;stQuads=quads;
for(const mo of mobs)if(inSphere(pl,mo.x,mo.y+.9,mo.z,1.6))emitMob(mo);
drawDyn(gl.TRIANGLES);
let ni=0;
for(const it of items){
const dx=it.x-P.x,dz=it.z-P.z;
if(dx*dx+dz*dz>1600||!inSphere(pl,it.x,it.y+.2,it.z,.6))continue;
emitItem(it,now);ni++}
if(dn){setWorldU(pwc,WLC,sky,now,fogN,fogF);drawDyn(gl.TRIANGLES);gl.useProgram(pw)}
const rr=(invOpen||chestOpen)?null:ray();
if(rr){emitOutline(rr.hit[0],rr.hit[1],rr.hit[2]);drawDyn(gl.LINES)}
gl.useProgram(ps);
const s=lk_.s,u=lk_.u;
gl.uniform3f(S_.f,f[0],f[1],f[2]);gl.uniform3f(S_.r,s[0],s[1],s[2]);gl.uniform3f(S_.u,u[0],u[1],u[2]);
gl.uniform3f(S_.sun,sky.sun[0],sky.sun[1],sky.sun[2]);
gl.uniform3f(S_.hor,sky.hor[0],sky.hor[1],sky.hor[2]);gl.uniform3f(S_.zen,sky.zen[0],sky.zen[1],sky.zen[2]);
gl.uniform1f(S_.tan,Math.tan(FOV/2));gl.uniform1f(S_.asp,aspect);gl.uniform1f(S_.day,sky.day);gl.uniform1f(S_.t,now);gl.uniform1f(S_.set,sky.set);
if(vaoExt)vaoExt.bindVertexArrayOES(skyVAO);
else{gl.disableVertexAttribArray(1);gl.disableVertexAttribArray(2);gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0)}
gl.drawArrays(gl.TRIANGLES,0,6)}

/* ---------- цикл ---------- */
let last=performance.now(),fpsAcc=0,fpsFrames=0,fpsShown=60,lastChange=0,lastDown=-99;
const elDbg=$('dbg');
function updateDbg(){
const mode=rdMode===0?'авто':'ручн.';
elDbg.textContent=`FPS ${fpsShown.toFixed(0)}\nXYZ ${P.x.toFixed(0)} ${P.y.toFixed(0)} ${P.z.toFixed(0)}\nHP ${P.hp} Food ${P.food}\nЧанки ${stDrawn}/${stMesh} · граней ${(stQuads/1000).toFixed(1)}k\nПредметов ${items.length}\nДальность ${RD} · картинка ${Math.round(scale*100)}%`}
function adapt(now){
if(rdMode!==0||frameNo<150)return;
const slow=fpsShown<26||(fpsShown<45&&!(fpsShown>27&&fpsShown<33.5));
if(slow&&now-lastChange>2&&qi>0){setQ(qi-1);lastChange=now;lastDown=now}
else if(fpsShown>=57&&now-lastChange>4&&now-lastDown>15&&qi<LAD.length-1){setQ(qi+1);lastChange=now}}
const RDS=[0,4,6,8,10];
elDbg.addEventListener('pointerdown',e=>{e.stopPropagation();rdMode=(rdMode+1)%RDS.length;
if(rdMode>0){RD=RDS[rdMode];if(scale!==1){scale=1;resize()}}else setQ(5);
toast(rdMode===0?'Качество: авто':'Дальность: '+RD+' чанков')});
function frame(){
const nowMs=performance.now();
const raw=(nowMs-last)/1000;last=nowMs;
const dt=Math.min(.05,raw);
frameNo++;
fpsAcc+=raw;fpsFrames++;
if(fpsAcc>=.5){fpsShown=fpsFrames/fpsAcc;fpsAcc=0;fpsFrames=0;adapt(nowMs/1000);updateDbg()}
const now=nowMs/1000,sky=skyState();
if(!invOpen&&!chestOpen)update(dt,sky,now);
render(now,sky);
requestAnimationFrame(frame)}
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
renderHUD();
if(!loaded)toast('Мир с реками, деревнями и вышками. Ешь еду, чтобы не умереть от голода. Броня снижает урон.');
requestAnimationFrame(frame);
})();
</script>
